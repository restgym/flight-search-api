# RESTgym API manifest
manifest_version: 1

id: flight-search
name: Flight Search API
version: "0.0.1-SNAPSHOT"         # Implementation-Version of flightsearchapi.jar, with its handling of errors changed by RESTgym (see the README)
description: Flight search API with management of airports and flights, secured with JWT.
domain: travel
license: MIT
repository: https://github.com/Rapter1990/flightsearchapi
technology:
  language: java
  framework: Spring Boot          # 3.4.1
  database: MongoDB               # 6.0, in the container, empty at each start (the original repository provides no data)

original_specification:           # OpenAPI 3.0.1, generated by springdoc at /v3/api-docs with springdoc 2.7.0 in place of 2.1.0, which fails with Spring Boot 3.4.1 (see README.md)
  version: "3.0"
  format: json
  origin: generated
  created_by: springdoc-openapi 2.7.0 (in place of 2.1.0, which fails at runtime)
  file: original/flight-search-openapi.json
  source: "runtime: /v3/api-docs"

authentication: proxy

# 5XX responses are the default error of Spring with its message (server.error.include-message, see the README), or
# the same errors as HTML (Whitelabel Error Page of Spring: its message is kept; Tomcat: its title). Values of the
# request repeated in the messages are replaced (the parts of a JWT, JSON tokens and characters, duplicated elements,
# URL-encoded inputs, an airport name, the id after "cant found", a departure airport id, an email), and ids, timestamps and numbers masked (e.g., JWT expired 220843480
# milliseconds ago at 2026-10-12T00:18:10.000Z).
# Threshold: just above the highest similarity between two different failures in the runs of rest-league-2027-official,
# 0.778 (not found errors of an airport or a flight)
server_errors:
  similarity_threshold: 0.78
  preprocessing:
    - json_fields: {fields: [message], min_length: 5}
    - replace: {pattern: '(?s).*There was an unexpected error \(type=[^)]*\)\.</div><div>(.*?)</div>.*', with: '\1'}
    - replace: {pattern: '(?s)(With given [\w ]+ =) .*', with: '\1 <value>'}
    - extract: {pattern: '(?s)<title>(.*?)</title>', group: 1}
    - replace: {pattern: '(?s)(Invalid Base64Url [\w ]+): .*', with: '\1: <value>'}
    - replace: {pattern: '(?s)Unrecognized token ''.*?''', with: 'Unrecognized token <value>'}
    - replace: {pattern: '(?s)(Unexpected|Illegal) character \(.*?code \d+(?: / 0x[0-9a-fA-F]+)?\)\)', with: '\1 character <value>'}
    - replace: {pattern: '(?s)(duplicate element:) .*', with: '\1 <value>'}
    - replace: {pattern: '(?s)(URLDecoder: .*? in:) .*', with: '\1 <value>'}
    - mask: [uuids, timestamps, numbers]
    - replace: {pattern: '(?s)^(Airport not found!\s+Airport given id cant found).*', with: '\1'}
    - replace: {pattern: '(?s)^(Airport not found!\s+Departure airport not found with id)\s.*', with: '\1 <value>'}
    - replace: {pattern: '(?s)^(User already exist!\s+The email is already used for another user :)\s.*', with: '\1 <value>'}
