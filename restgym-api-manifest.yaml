# RESTgym API manifest
manifest_version: 1

id: flight-search
name: Flight Search API
version: "0.0.1-SNAPSHOT"         # Implementation-Version of flightsearchapi.jar, with its handling of errors changed by RESTgym (see the README)
description: Flight search API with management of airports and flights, secured with JWT.
domain: travel
license: MIT
repository: https://github.com/Rapter1990/flightsearchapi
technology:
  language: java
  framework: Spring Boot          # 3.4.1
  database: MongoDB

original_specification:           # OpenAPI 3.0.1, generated by springdoc at /v3/api-docs with springdoc 2.7.0 in place of 2.1.0, which fails with Spring Boot 3.4.1 (see README.md)
  version: "3.0"
  format: json
  origin: generated
  created_by: springdoc-openapi 2.7.0 (in place of 2.1.0, which fails at runtime)
  file: openapi-original.json
  source: "runtime: /v3/api-docs"

authentication: proxy

server_errors:
  similarity_threshold: 0.7
  preprocessing:
    - json_fields: {fields: [message], min_length: 5}     # the body of the 5XX of Spring (server.error.include-message, see the README)
    - mask: [uuids, timestamps, numbers]                  # e.g., JWT expired 220843480 milliseconds ago at 2026-10-12T00:18:10.000Z
