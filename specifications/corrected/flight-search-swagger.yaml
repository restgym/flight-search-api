          - REQUESTED_RANGE_NOT_SATISFIABLE
          - EXPECTATION_FAILED
          - I_AM_A_TEAPOT
          - INSUFFICIENT_SPACE_ON_RESOURCE
          - METHOD_FAILURE
          - DESTINATION_LOCKED
          - UNPROCESSABLE_ENTITY
          - LOCKED
          - FAILED_DEPENDENCY
          - TOO_EARLY
          - UPGRADE_REQUIRED
          - PRECONDITION_REQUIRED
          - TOO_MANY_REQUESTS
          - REQUEST_HEADER_FIELDS_TOO_LARGE
          - UNAVAILABLE_FOR_LEGAL_REASONS
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - GATEWAY_TIMEOUT
          - HTTP_VERSION_NOT_SUPPORTED
          - VARIANT_ALSO_NEGOTIATES
          - INSUFFICIENT_STORAGE
          - LOOP_DETECTED
          - BANDWIDTH_LIMIT_EXCEEDED
          - NOT_EXTENDED
          - NETWORK_AUTHENTICATION_REQUIRED
      isSuccess:
        type: boolean
      response:
        type: string
  CustomPaging:
    type: object
    required:
      - pageNumber
      - pageSize
    properties:
      pageNumber:
        type: integer
        format: int32
        minimum: 1
      pageSize:
        type: integer
        format: int32
        minimum: 1
  SearchFlightRequest:
    type: object
    required:
      - departureTime
      - fromAirportId
      - pagination
      - toAirportId
    properties:
      pagination:
        $ref: '#/definitions/CustomPaging'
      fromAirportId:
        type: string
      toAirportId:
        type: string
      departureTime:
        type: string
        format: date
      arrivalTime:
        type: string
        format: date
  CustomPagingResponseFlightResponse:
    type: object
    properties:
      content:
        type: array
        items:
          $ref: '#/definitions/FlightResponse'
      pageNumber:
        type: integer
        format: int32
      pageSize:
        type: integer
        format: int32
      totalElementCount:
        type: integer
        format: int64
      totalPageCount:
        type: integer
        format: int32
  CustomResponseCustomPagingResponseFlightResponse:
    type: object
    properties:
      time:
        type: string
        format: date-time
      httpStatus:
        type: string
        enum:
          - CONTINUE
          - SWITCHING_PROTOCOLS
          - PROCESSING
          - EARLY_HINTS
          - CHECKPOINT
          - OK
          - CREATED
          - ACCEPTED
          - NON_AUTHORITATIVE_INFORMATION
          - NO_CONTENT
