          - UNSUPPORTED_MEDIA_TYPE
          - REQUESTED_RANGE_NOT_SATISFIABLE
          - EXPECTATION_FAILED
          - I_AM_A_TEAPOT
          - INSUFFICIENT_SPACE_ON_RESOURCE
          - METHOD_FAILURE
          - DESTINATION_LOCKED
          - UNPROCESSABLE_ENTITY
          - LOCKED
          - FAILED_DEPENDENCY
          - TOO_EARLY
          - UPGRADE_REQUIRED
          - PRECONDITION_REQUIRED
          - TOO_MANY_REQUESTS
          - REQUEST_HEADER_FIELDS_TOO_LARGE
          - UNAVAILABLE_FOR_LEGAL_REASONS
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - GATEWAY_TIMEOUT
          - HTTP_VERSION_NOT_SUPPORTED
          - VARIANT_ALSO_NEGOTIATES
          - INSUFFICIENT_STORAGE
          - LOOP_DETECTED
          - BANDWIDTH_LIMIT_EXCEEDED
          - NOT_EXTENDED
          - NETWORK_AUTHENTICATION_REQUIRED
      isSuccess:
        type: boolean
      response:
        $ref: '#/definitions/FlightResponse'
  FlightResponse:
    type: object
    properties:
      id:
        type: string
      fromAirport:
        $ref: '#/definitions/AirportResponse'
      toAirport:
        $ref: '#/definitions/AirportResponse'
      departureTime:
        type: string
        format: date-time
      arrivalTime:
        type: string
        format: date-time
      price:
        type: number
        format: double
  UpdateAirportRequest:
    type: object
    required:
      - cityName
      - name
    properties:
      name:
        type: string
      cityName:
        type: string
  CustomResponseAirportResponse:
    type: object
    properties:
      time:
        type: string
        format: date-time
      httpStatus:
        type: string
        enum:
          - CONTINUE
          - SWITCHING_PROTOCOLS
          - PROCESSING
          - EARLY_HINTS
          - CHECKPOINT
