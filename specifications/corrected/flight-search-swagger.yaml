          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - GATEWAY_TIMEOUT
          - HTTP_VERSION_NOT_SUPPORTED
          - VARIANT_ALSO_NEGOTIATES
          - INSUFFICIENT_STORAGE
          - LOOP_DETECTED
          - BANDWIDTH_LIMIT_EXCEEDED
          - NOT_EXTENDED
          - NETWORK_AUTHENTICATION_REQUIRED
      isSuccess:
        type: boolean
      response:
        $ref: '#/definitions/AirportResponse'
  CreateFlightRequest:
    type: object
    required:
      - arrivalTime
      - departureTime
      - fromAirportId
      - price
      - toAirportId
    properties:
      fromAirportId:
        type: string
      toAirportId:
        type: string
      departureTime:
        type: string
        format: date-time
      arrivalTime:
        type: string
        format: date-time
      price:
        type: number
        format: double
  CustomResponseString:
    type: object
    properties:
      time:
        type: string
        format: date-time
      httpStatus:
        type: string
        enum:
          - CONTINUE
          - SWITCHING_PROTOCOLS
          - PROCESSING
          - EARLY_HINTS
          - CHECKPOINT
          - OK
          - CREATED
          - ACCEPTED
          - NON_AUTHORITATIVE_INFORMATION
          - NO_CONTENT
          - RESET_CONTENT
          - PARTIAL_CONTENT
          - MULTI_STATUS
          - ALREADY_REPORTED
          - IM_USED
          - MULTIPLE_CHOICES
          - MOVED_PERMANENTLY
