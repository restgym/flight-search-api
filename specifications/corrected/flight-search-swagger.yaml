swagger: "2.0"
info:
  title: flightsearchapi
  description: 'Case Study - Flight Search Api (Java 21, Spring Boot, Mongodb, JUnit, Spring Security, JWT, Docker, Kubernetes, Prometheus, Grafana, Github Actions (CI/CD) ) '
  contact:
    name: Sercan Noyan Germiyanoğlu
    url: https://github.com/Rapter1990/flightsearchapi
  version: 1.0.0
host: localhost:8080
schemes:
  - http
paths:
  /api/v1/flights/{id}:
    get:
      tags:
        - Flight Management
      summary: Get flight by ID
      description: Retrieves a flight by its ID. Accessible by both ADMIN and USER roles.
      operationId: getFlightById
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: Flight successfully retrieved
          schema:
            $ref: '#/definitions/CustomResponseFlightResponse'
        "400":
          description: Invalid flight details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    put:
      tags:
        - Flight Management
      summary: Update an flight
      description: Updates an existing flight by its ID. Accessible by ADMIN only.
      operationId: updateFlightById
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateFlightRequest'
      responses:
        "200":
          description: Flight successfully updated
          schema:
            $ref: '#/definitions/CustomResponseFlightResponse'
        "400":
          description: Invalid update details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Flight not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    delete:
      tags:
        - Flight Management
      summary: Delete an flight
      description: Deletes a flight by its ID. Accessible by ADMIN only.
      operationId: deleteAirportById
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: Flight successfully deleted
          schema:
            $ref: '#/definitions/CustomResponseString'
        "400":
          description: Invalid update details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Flight not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
  /api/v1/airports/{id}:
    get:
      tags:
        - Airport Management
      summary: Get airport by ID
      description: Retrieves an airport by its ID. Accessible by both ADMIN and USER roles.
      operationId: getAirportById
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: Airport successfully retrieved
          schema:
            $ref: '#/definitions/CustomResponseAirportResponse'
        "400":
          description: Invalid airport details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    put:
      tags:
        - Airport Management
      summary: Update an airport
      description: Updates an existing airport by its ID. Accessible by ADMIN only.
      operationId: updateAirportById
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateAirportRequest'
      responses:
        "200":
          description: Airport successfully updated
          schema:
            $ref: '#/definitions/CustomResponseAirportResponse'
        "400":
          description: Invalid update details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    delete:
      tags:
        - Airport Management
      summary: Delete an airport
      description: Deletes an airport by its ID. Accessible by ADMIN only.
      operationId: deleteAirportById_1
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: Airport successfully deleted
          schema:
            $ref: '#/definitions/CustomResponseString'
        "400":
          description: Invalid update details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
  /api/v1/flights:
    get:
      tags:
        - Flight Management
      summary: Get all flights
      description: Retrieves a paginated list of flights. Accessible by both ADMIN and USER roles.
      operationId: getAllFlights
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AirportPagingRequest'
      responses:
        "200":
          description: Flights successfully retrieved
          schema:
            $ref: '#/definitions/CustomResponseCustomPagingResponseFlightResponse'
        "400":
          description: Invalid flights details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Flight not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    post:
      tags:
        - Flight Management
      summary: Create a new flight
      description: Creates a new flight and saves it to the database. Accessible by ADMIN only.
      operationId: createFlight
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateFlightRequest'
      responses:
        "200":
          description: Flight successfully created
          schema:
            $ref: '#/definitions/CustomResponseString'
        "400":
          description: Invalid flight details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
  /api/v1/flights/search:
    post:
      tags:
        - Search Flight
      summary: Search for flights
      description: Searches for flights based on departure, arrival airports, departure date, and optionally return date. Accessible by ADMIN and USER roles.
      operationId: searchFlights
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SearchFlightRequest'
      responses:
        "200":
          description: Flights successfully retrieved
          schema:
            $ref: '#/definitions/CustomResponseCustomPagingResponseFlightResponse'
        "400":
          description: Invalid search criteria provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
  /api/v1/authentication/user/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Registers a new user in the system.
      operationId: registerAdmin
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/RegisterRequest'
      responses:
        "200":
          description: User successfully registered
          schema:
            $ref: '#/definitions/CustomResponseVoid'
        "400":
          description: Invalid request data
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/CustomError'
  /api/v1/authentication/user/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Refreshes an expired access token using a valid refresh token.
      operationId: refreshToken
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TokenRefreshRequest'
      responses:
        "200":
          description: Token successfully refreshed
          schema:
            $ref: '#/definitions/CustomResponseTokenResponse'
        "400":
          description: Invalid refresh token
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
  /api/v1/authentication/user/logout:
    post:
      tags:
        - Authentication
      summary: Log out a user
      description: Invalidates the provided token, effectively logging out the user.
      operationId: logout
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TokenInvalidateRequest'
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/CustomResponseVoid'
        "400":
          description: Invalid token provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
  /api/v1/authentication/user/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates a user and returns an access and refresh token.
      operationId: loginAdmin
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/LoginRequest'
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/CustomResponseTokenResponse'
        "400":
          description: Invalid request data or wrong password
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/CustomError'
  /api/v1/airports:
    get:
      tags:
        - Airport Management
      summary: Get all airports
      description: Retrieves a paginated list of airports. Accessible by both ADMIN and USER roles.
      operationId: getAllAirports
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AirportPagingRequest'
      responses:
        "200":
          description: Airports successfully retrieved
          schema:
            $ref: '#/definitions/CustomResponseCustomPagingResponseAirportResponse'
        "400":
          description: Invalid airports details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
        "404":
          description: Airport not found
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
    post:
      tags:
        - Airport Management
      summary: Create a new airport
      description: Creates a new airport and saves it to the database. Accessible by ADMIN only.
      operationId: createAirport
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateAirportRequest'
      responses:
        "200":
          description: Airport successfully created
          schema:
            $ref: '#/definitions/CustomResponseString'
        "400":
          description: Invalid airport details provided
          schema:
            allOf:
              - $ref: '#/definitions/CustomError'
        "401":
          description: Unauthorized, authentication is required
          schema:
            $ref: '#/definitions/CustomError'
        "403":
          description: Access forbidden
          schema:
            $ref: '#/definitions/CustomError'
      security:
        - bearerAuth: []
definitions:
  UpdateFlightRequest:
    type: object
    required:
      - arrivalTime
      - departureTime
      - fromAirportId
      - price
      - toAirportId
    properties:
      fromAirportId:
        type: string
      toAirportId:
        type: string
      departureTime:
        type: string
        format: date-time
      arrivalTime:
        type: string
        format: date-time
      price:
        type: number
        format: double
  AirportResponse:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      cityName:
        type: string
  CustomResponseFlightResponse:
    type: object
    properties:
      time:
        type: string
        format: date-time
      httpStatus:
        type: string
        enum:
          - CONTINUE
          - SWITCHING_PROTOCOLS
          - PROCESSING
          - EARLY_HINTS
          - CHECKPOINT
          - OK
          - CREATED
          - ACCEPTED
          - NON_AUTHORITATIVE_INFORMATION
          - NO_CONTENT
          - RESET_CONTENT
          - PARTIAL_CONTENT
